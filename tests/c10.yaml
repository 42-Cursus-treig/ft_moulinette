project: c10
display_name: C10
required_exercises: 4
symbol_check: nm
symbol_aliases:
  __xpg_basename: basename
  __errno_location: errno
  __isoc99_sscanf: sscanf
symbol_ignore:
- __libc_start_main
- __stack_chk_fail
- __cxa_finalize
- __gmon_start__
- _ITM_deregisterTMCloneTable
- _ITM_registerTMCloneTable
points:
- 15
- 35
- 65
- 100
exercises:
- name: ex00
  dir: ex00
  source_file: Makefile
  build_mode: make
  run_artifact: ft_display_file
  allowed_functions:
  - close
  - open
  - read
  - write
  expect_artifacts:
  - ft_display_file
  make_targets:
  - clean
  - fclean
  harness_files:
  - harness/c10/sample.txt
  tests:
  - name: Affiche le contenu du fichier
    args:
    - sample.txt
    expected_stdout: |
      ligne une
      ligne deux
      ligne trois
    expected_stderr: ''
    timeout_sec: 5
  - name: Aucun argument
    args: []
    expected_stdout: ''
    expected_stderr: |
      File name missing.
    timeout_sec: 5
  - name: Trop d'arguments
    args:
    - sample.txt
    - sample.txt
    expected_stdout: ''
    expected_stderr: |
      Too many arguments.
    timeout_sec: 5
  - name: Fichier illisible
    args:
    - /nonexistent_file_xyz
    expected_stdout: ''
    expected_stderr: |
      Cannot read file.
    timeout_sec: 5
- name: ex01
  dir: ex01
  source_file: Makefile
  build_mode: make
  run_artifact: ft_cat
  reference_cmd: cat
  allowed_functions:
  - close
  - open
  - read
  - write
  - strerror
  - basename
  - errno
  expect_artifacts:
  - ft_cat
  make_targets:
  - clean
  - fclean
  harness_files:
  - harness/c10/sample.txt
  - harness/c10/text.txt
  - harness/c10/empty.txt
  tests:
  - name: Fichier multi-lignes
    args:
    - sample.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: Autre fichier
    args:
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: Fichier vide
    args:
    - empty.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: Plusieurs fichiers
    args:
    - sample.txt
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: Fichier inexistant
    args:
    - /nonexistent_file_xyz
    compare_stderr: true
    timeout_sec: 5
  - name: Lecture sur stdin
    args: []
    stdin: |
      entrée standard
      deuxième ligne
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
- name: ex02
  dir: ex02
  source_file: Makefile
  build_mode: make
  run_artifact: ft_tail
  reference_cmd: tail
  allowed_functions:
  - close
  - open
  - read
  - write
  - malloc
  - free
  - strerror
  - basename
  - errno
  expect_artifacts:
  - ft_tail
  make_targets:
  - clean
  - fclean
  harness_files:
  - harness/c10/text.txt
  - harness/c10/empty.txt
  tests:
  - name: tail -c 5
    args:
    - -c
    - '5'
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: tail -c 20
    args:
    - -c
    - '20'
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: tail -c plus grand que le fichier
    args:
    - -c
    - '9999'
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: tail -c 1
    args:
    - -c
    - '1'
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: tail -c sur fichier vide
    args:
    - -c
    - '10'
    - empty.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: tail -c fichier inexistant
    args:
    - -c
    - '5'
    - /nonexistent_file_xyz
    compare_stderr: true
    timeout_sec: 5
- name: ex03
  dir: ex03
  source_file: Makefile
  build_mode: make
  run_artifact: ft_hexdump
  reference_cmd: hexdump
  allowed_functions:
  - close
  - open
  - read
  - write
  - malloc
  - free
  - strerror
  - basename
  - errno
  expect_artifacts:
  - ft_hexdump
  make_targets:
  - clean
  - fclean
  harness_files:
  - harness/c10/text.txt
  - harness/c10/mixed.bin
  - harness/c10/empty.txt
  tests:
  - name: hexdump -C texte
    args:
    - -C
    - text.txt
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: hexdump -C binaire (octets non imprimables)
    args:
    - -C
    - mixed.bin
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  # Sortie littérale plutôt que reference_cmd : un fichier vide ne produit
  # AUCUNE sortie. Cas piégeux (beaucoup affichent l'offset 00000000), et
  # indépendant de la présence de hexdump dans la sandbox.
  - name: hexdump -C fichier vide
    args:
    - -C
    - empty.txt
    expected_stdout: ''
    expected_stderr: ''
    expected_exit_code: 0
    timeout_sec: 5
  - name: hexdump -C plusieurs fichiers
    args:
    - -C
    - text.txt
    - mixed.bin
    compare_stderr: true
    expected_exit_code: 0
    timeout_sec: 5
  - name: hexdump -C fichier inexistant
    args:
    - -C
    - /nonexistent_file_xyz
    compare_stderr: true
    timeout_sec: 5