- name: ex05
  dir: ex05
  source_file: Makefile
  build_mode: make
  run_artifact: do-op
  allowed_functions:
  - write
  expect_artifacts:
  - do-op
  make_targets:
  - clean
  - fclean
  tests:
  - name: addition
    args:
    - '1'
    - +
    - '1'
    stdin: ''
    expected_stdout: |
      2
    expected_exit_code: 0
    timeout_sec: 5
  - name: soustraction_atoi_sujet
    args:
    - 42amis
    - '-'
    - --+-20toto12
    stdin: ''
    expected_stdout: |
      62
    expected_exit_code: 0
    timeout_sec: 5
  - name: multiplication
    args:
    - '6'
    - '*'
    - '7'
    stdin: ''
    expected_stdout: |
      42
    expected_exit_code: 0
    timeout_sec: 5
  - name: division
    args:
    - '25'
    - /
    - '4'
    stdin: ''
    expected_stdout: |
      6
    expected_exit_code: 0
    timeout_sec: 5
  - name: modulo
    args:
    - '25'
    - '%'
    - '4'
    stdin: ''
    expected_stdout: |
      1
    expected_exit_code: 0
    timeout_sec: 5
  - name: operateur_inconnu
    args:
    - '1'
    - p
    - '1'
    stdin: ''
    expected_stdout: |
      0
    expected_exit_code: 0
    timeout_sec: 5
  - name: operateur_multi_caracteres
    args:
    - foo
    - plus
    - bar
    stdin: ''
    expected_stdout: |
      0
    expected_exit_code: 0
    timeout_sec: 5
  - name: division_par_zero
    args:
    - '25'
    - /
    - '0'
    stdin: ''
    expected_stdout: |
      Stop : division by zero
    expected_exit_code: 0
    timeout_sec: 5
  - name: modulo_par_zero
    args:
    - '25'
    - '%'
    - '0'
    stdin: ''
    expected_stdout: |
      Stop : modulo by zero
    expected_exit_code: 0
    timeout_sec: 5
  - name: sans_arguments
    args: []
    stdin: ''
    expected_stdout: ''
    expected_exit_code: 0
    timeout_sec: 5
  - name: trop_d_arguments
    args:
    - '1'
    - +
    - '1'
    - '1'
    stdin: ''
    expected_stdout: ''
    expected_exit_code: 0
    timeout_sec: 5
