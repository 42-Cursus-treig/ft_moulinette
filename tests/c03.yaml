exercises:
- name: ex00
  dir: ex00
  source_file: ft_strcmp.c
  harness: harness/c03/ex00.c
  allowed_functions: []
  tests:
  - name: difference_simple
    args:
    - abc
    - abd
    stdin: ''
    expected_stdout: '-1'
    expected_exit_code: 0
    timeout_sec: 5
  - name: difference_casse
    args:
    - Hello
    - hello
    stdin: ''
    expected_stdout: '-32'
    expected_exit_code: 0
    timeout_sec: 5
  - name: prefixe
    args:
    - abc
    - ab
    stdin: ''
    expected_stdout: '99'
    expected_exit_code: 0
    timeout_sec: 5
  - name: egalite
    args:
    - abc
    - abc
    stdin: ''
    expected_stdout: '0'
    expected_exit_code: 0
    timeout_sec: 5
  - name: chaines_vides
    args:
    - ''
    - ''
    stdin: ''
    expected_stdout: '0'
    expected_exit_code: 0
    timeout_sec: 5
- name: ex01
  dir: ex01
  source_file: ft_strncmp.c
  harness: harness/c03/ex01.c
  allowed_functions: []
  tests:
  - name: difference_dans_n
    args:
    - abcXX
    - abdYY
    - '3'
    stdin: ''
    expected_stdout: '-1'
    expected_exit_code: 0
    timeout_sec: 5
  - name: egales_dans_n
    args:
    - abcXX
    - abcYY
    - '3'
    stdin: ''
    expected_stdout: '0'
    expected_exit_code: 0
    timeout_sec: 5
  - name: n_zero
    args:
    - abc
    - abc
    - '0'
    stdin: ''
    expected_stdout: '0'
    expected_exit_code: 0
    timeout_sec: 5
