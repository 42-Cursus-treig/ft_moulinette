project: c08
display_name: C08
norm_extra_rules:
- CheckForbiddenSourceHeader
points:
- 1
- 10
- 20
- 40
- 70
- 100
exercises:
- name: ex00
  dir: ex00
  source_file: ft.h
  harness: harness/c08/ex00.c
  compile_only: true
  allowed_functions: []
- name: ex01
  dir: ex01
  source_file: ft_boolean.h
  harness: harness/c08/ex01.c
  norm_extra_rules:
  - CheckDefine
  allowed_functions:
  - write
  tests:
  - name: Zero argument (pair)
    args: []
    stdin: ''
    expected_stdout: |
      I have an even number of arguments.
    expected_exit_code: 0
    timeout_sec: 5
  - name: Un argument (impair)
    args:
    - x
    stdin: ''
    expected_stdout: |
      I have an odd number of arguments.
    expected_exit_code: 0
    timeout_sec: 5
  - name: Deux arguments (pair)
    args:
    - x
    - 'y'
    stdin: ''
    expected_stdout: |
      I have an even number of arguments.
    expected_exit_code: 0
    timeout_sec: 5
- name: ex02
  dir: ex02
  source_file: ft_abs.h
  harness: harness/c08/ex02.c
  norm_extra_rules:
  - CheckDefine
  allowed_functions: []
  tests:
  - name: Valeur absolue
    args: []
    stdin: ''
    expected_stdout: |
      42
      42
      0
    expected_exit_code: 0
    timeout_sec: 5
- name: ex03
  dir: ex03
  source_file: ft_point.h
  harness: harness/c08/ex03.c
  compile_only: true
  allowed_functions: []
- name: ex04
  dir: ex04
  source_file: ft_strs_to_tab.c
  harness: harness/c08/ex04.c
  harness_files:
  - harness/c08/ft_stock_str.h
  - harness/c08/ref_show_tab.c
  allowed_functions:
  - malloc
  - free
  tests:
  - name: Plusieurs chaines
    args:
    - bonjour
    - le
    - monde
    - '42'
    stdin: ''
    expected_stdout: |
      bonjour
      7
      bonjour
      le
      2
      le
      monde
      5
      monde
      42
      2
      42
    expected_exit_code: 0
    timeout_sec: 5
  - name: Une seule chaine
    args:
    - hello
    stdin: ''
    expected_stdout: |
      hello
      5
      hello
    expected_exit_code: 0
    timeout_sec: 5
  - name: Aucune chaine
    args: []
    stdin: ''
    expected_stdout: ''
    expected_exit_code: 0
    timeout_sec: 5
- name: ex05
  dir: ex05
  source_file: ft_show_tab.c
  harness: harness/c08/ex05.c
  harness_files:
  - harness/c08/ft_stock_str.h
  - harness/c08/ref_strs_to_tab.c
  allowed_functions:
  - write
  tests:
  - name: Plusieurs chaines
    args:
    - bonjour
    - le
    - monde
    - '42'
    stdin: ''
    expected_stdout: |
      bonjour
      7
      bonjour
      le
      2
      le
      monde
      5
      monde
      42
      2
      42
    expected_exit_code: 0
    timeout_sec: 5
  - name: Une seule chaine
    args:
    - hello
    stdin: ''
    expected_stdout: |
      hello
      5
      hello
    expected_exit_code: 0
    timeout_sec: 5
