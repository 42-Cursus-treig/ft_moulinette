services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MOULINETTE_ADDR=:8080

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ft-moulinette-sandbox:latest
    profiles: ["build-only"]
