{{define "login"}}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ft_moulinette - Connexion</title>
<script src="/static/js/theme.js"></script>
<link rel="preconnect" href="https://api.intra.42.fr">
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/login.css">
<script src="/static/js/login.js" defer></script>
</head>
<body class="login-body">

  <div class="login-theme-corner">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de thème">
      <img id="theme-icon" src="/static/img/moon.svg" alt="" width="20" height="20">
    </button>
  </div>

  <main class="login-container">
    <div class="login-left">
      <div class="login-surtitle">
        <span class="surtitle-bar"></span> PISCINE C • 42
      </div>
      <h1 class="login-title">FT<span>_</span>MOULINETTE</h1>
      <p class="login-subtitle">Correcteur automatique.</p>
    </div>

    <div class="login-right">
      <div class="brutal-card new-login-card">
        
        <div class="logo-background-panel">
          <div class="gta-logo-wrapper">
            <div class="gta-logo-box" aria-label="Logo 42"></div>
          </div>
        </div>
        
        <a href="/auth/login" class="login-cta" id="login-cta">
          <span id="login-cta-label">SE CONNECTER</span>
          <svg id="login-cta-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="M13 6l6 6-6 6"></path>
          </svg>
          <span id="login-cta-spinner" class="spinner" hidden></span>
        </a>

        <div id="login-terminal" class="mini-terminal">
          <div id="terminal-output" class="mini-terminal-body"></div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
{{end}}
