{{define "history"}}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ft_moulinette — historique</title>
<script>
  (function () {
    var stored = localStorage.getItem('ft-moulinette-theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Historique</h1>
    <div class="header-actions">
      <a href="/" class="theme-toggle" aria-label="Retour à l'accueil" title="Retour à l'accueil">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
      </a>
      <span class="user-badge">{{.User.Login}}</span>
      <form method="post" action="/auth/logout">
        <button type="submit" class="theme-toggle" title="Se déconnecter" aria-label="Se déconnecter">⏻</button>
      </form>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de thème">
        <img id="theme-icon" src="/static/moon.svg" alt="" width="20" height="20">
      </button>
    </div>
  </header>

  <div id="error-banner"></div>

  <div id="jobs-list">
    {{if not .Jobs}}
    <p class="empty-state">Aucun test n'a encore été lancé. Les corrections que vous soumettez apparaîtront ici.</p>
    {{else}}
    {{range .Jobs}}{{template "job_row" .}}{{end}}
    {{end}}
  </div>
</body>
</html>
{{end}}
