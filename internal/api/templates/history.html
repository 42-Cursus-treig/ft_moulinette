{{define "history"}}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ft_moulinette — historique</title>
<script>
  (function () {
    var stored = localStorage.getItem('ft-moulinette-theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Historique</h1>
    {{template "header_actions" .}}
  </header>

  <div id="error-banner"></div>

  <div id="jobs-list">
    {{if not .Jobs}}
    <p class="empty-state">Aucun test n'a encore été lancé. Les corrections que vous soumettez apparaîtront ici.</p>
    {{else}}
    {{range .Jobs}}{{template "job_row" .}}{{end}}
    {{end}}
  </div>
</body>
</html>
{{end}}
