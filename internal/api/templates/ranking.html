{{define "ranking"}}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ft_moulinette - classement</title>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/ranking.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js" defer></script>
<script src="/static/js/app.js" defer></script>
<script src="/static/js/ranking.js" defer></script>
<script src="/static/js/ranking_chart.js" defer></script>
</head>
<body>
  <header>
    <h1>Classement</h1>
    <div class="header-actions">
      <a href="/" class="theme-toggle" aria-label="Retour à l'accueil" title="Retour à l'accueil">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
      </a>
      <span class="user-badge">{{.User.Login}}</span>
      <form method="post" action="/auth/logout">
        <button type="submit" class="theme-toggle" title="Se déconnecter" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </form>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de thème">
        <img id="theme-icon" src="/static/img/moon.svg" alt="" width="20" height="20">
      </button>
    </div>
  </header>

  {{template "exam_banner" .}}

  <div id="error-banner"></div>

  <div class="ranking-controls" id="ranking-controls">
    <div class="rank-tabs" role="tablist" aria-label="Type de classement">
      <button type="button" class="rank-tab active" data-tab="score" role="tab" aria-selected="true">Score</button>
      <button type="button" class="rank-tab" data-tab="projects" role="tab" aria-selected="false">Projets</button>
      <button type="button" class="rank-tab" data-tab="exam" role="tab" aria-selected="false">Exam</button>
      <button type="button" class="rank-tab" data-tab="progress" role="tab" aria-selected="false">Progression</button>
    </div>

    <div class="exam-picker" id="exam-picker" hidden>
      {{range .Exams}}
      <button type="button" class="exam-pill{{if eq .Value "00"}} active{{end}}" data-exam="{{.Value}}">{{.Label}}</button>
      {{end}}
    </div>
  </div>

  <div id="ranking-content">
    <div class="ranking-state brutal-card">
      <span class="spinner"></span>
      <p>Chargement du classement…</p>
    </div>
  </div>
</body>
</html>
{{end}}
