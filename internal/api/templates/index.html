{{define "index"}}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ft_moulinette</title>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/index.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js" defer></script>
<script src="/static/js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>ft_moulinette</h1>
    {{template "header_actions" .}}
  </header>

  {{template "exam_banner" .}}

  <div id="error-banner"></div>

  <form hx-post="/ui/jobs" hx-target="#jobs-list" hx-swap="afterbegin" hx-encoding="multipart/form-data" hx-indicator="#submit-indicator">
    <div class="exercise-grid">
      <input type="hidden" id="exercise-value" name="exercise" value="">
      {{range .Exercises}}
      {{if .Locked}}
      <button type="button" class="exercise-btn locked" disabled title="Sujet verrouillé">
        {{.Label}}
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </button>
      {{else}}
      <button type="button" class="exercise-btn" data-value="{{.ID}}">{{.Label}}</button>
      {{end}}
      {{end}}
    </div>

    <div class="source-tabs" role="tablist">
      <button type="button" class="source-tab active" data-target="archive" role="tab" aria-selected="true">Archive</button>
      <button type="button" class="source-tab" data-target="git" role="tab" aria-selected="false">Lien Git</button>
      <button type="button" class="source-tab" disabled title="Vogsphere en cours d'implémentation">
        Lien Vogsphere<span class="badge-soon">Bientôt</span>
      </button>
    </div>

    <div class="source-panel" data-panel="archive">
      <div class="dropzone" id="dropzone">
        <input type="file" id="archive-input" name="archive" accept=".zip,.tar.gz,.tgz,.rar" required hidden>
        <span id="dropzone-label">Dépose ton archive ici (.zip, .tar.gz, .rar)</span>
      </div>
    </div>

    <div class="source-panel" data-panel="git" hidden>
      <div class="repo-visibility-picker" role="tablist">
        <button type="button" class="repo-visibility-pill active" data-visibility="public" role="tab" aria-selected="true">Dépôt public</button>
        <button type="button" class="repo-visibility-pill" data-visibility="private" role="tab" aria-selected="false">Dépôt privé</button>
      </div>

      <input type="text" id="repo-url-input" name="repo_url" class="git-input" placeholder="https://github.com/pseudo/depot">

      <div class="repo-visibility-panel" data-visibility-panel="private" hidden>
        <input type="password" id="github-token-input" name="github_token" class="git-input" placeholder="Jeton d'accès personnel GitHub" autocomplete="off">
      </div>
    </div>

    <div class="form-row">
      <button type="submit" id="submit-button">
        Corriger
        <span id="submit-indicator" class="htmx-indicator spinner"></span>
      </button>
    </div>
  </form>

  <div id="jobs-list">
    {{range .Jobs}}{{template "job_row" .}}{{end}}
  </div>
</body>
</html>
{{end}}
