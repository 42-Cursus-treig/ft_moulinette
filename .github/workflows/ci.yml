name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vérification du formatage
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers mal formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Compilation
        run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validation la config docker-compose
        run: |
          touch .env
          docker compose config

      - name: Build de l'image serveur
        run: docker build -t ftm-server-test -f Dockerfile .

      - name: Build de l'image sandbox
        run: docker build -t ftm-sandbox-test -f Dockerfile.sandbox .

