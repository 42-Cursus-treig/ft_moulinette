name: Bug Report
description: Signaler un bug
title: "[Bug] "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez le problème rencontré.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran (facultatif)

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.0.0"
